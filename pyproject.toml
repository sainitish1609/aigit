[project]
name = "aigit"
version = "0.1.0"
description = "Version AI system behavior with manifests, lockfiles, snapshots, and diffs."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
  { name = "aigit contributors" }
]
keywords = [
  "ai",
  "llm",
  "version-control",
  "evals",
  "observability",
  "mlops",
  "prompt-engineering",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/aigit-dev/aigit"
Repository = "https://github.com/aigit-dev/aigit"
Issues = "https://github.com/aigit-dev/aigit/issues"
Changelog = "https://github.com/aigit-dev/aigit/blob/main/CHANGELOG.md"

[project.scripts]
aigit = "aigit_cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/aigit-core/src/aigit_core", "packages/aigit-cli/src/aigit_cli"]

[tool.hatch.build.targets.sdist]
include = [
  "packages/",
  "tests/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
  "CODE_OF_CONDUCT.md",
  "RELEASE_NOTES.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/aigit-core/src",
  "packages/aigit-cli/src",
]
