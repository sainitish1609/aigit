[project]
name = "aigit"
version = "0.1.0"
description = "Version AI system behavior with manifests, lockfiles, snapshots, and diffs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
]

[project.scripts]
aigit = "aigit_cli.main:app"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/aigit-core/src/aigit_core", "packages/aigit-cli/src/aigit_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  "packages/aigit-core/src",
  "packages/aigit-cli/src",
]
